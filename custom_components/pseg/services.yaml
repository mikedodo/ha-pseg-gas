backfill_history:
  name: Backfill Energy History
  description: Fetches historical daily energy consumption and cost from the PSE&G portal and imports them into Home Assistant Long-Term Statistics.
  fields:
    start_date:
      name: Start Date
      description: The starting date to backfill from (YYYY-MM-DD). Defaults to 2 years ago if left empty.
      example: "2024-10-19"
      selector:
        date:
    end_date:
      name: End Date
      description: The ending date to backfill to (YYYY-MM-DD). Defaults to today if left empty.
      example: "2026-10-19"
      selector:
        date:
    commodity:
      name: Commodity
      description: Which utility history to backfill (all, electricity, or gas).
      default: all
      selector:
        select:
          options:
            - label: "Both (Electricity & Gas)"
              value: "all"
            - label: "Electricity Only"
              value: "electricity"
            - label: "Natural Gas Only"
              value: "gas"
